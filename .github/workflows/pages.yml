name: Publish Academic Adventure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build browser game
        run: |
          python -m pip install pygbag==0.9.3
          python tools/prepare_web.py "$RUNNER_TEMP/academic-adventure"
          game="$RUNNER_TEMP/academic-adventure"
          for sound in "$game"/assets/sounds/*.wav; do
            ffmpeg -nostdin -loglevel error -i "$sound" "${sound%.wav}.ogg"
            rm "$sound"
          done
          find "$game" -name '*.py' -exec sed -i 's/\.wav"/.ogg"/g; s/\.wav\x27/.ogg\x27/g' {} +
          python -m pygbag --build "$RUNNER_TEMP/academic-adventure"
          test -s "$RUNNER_TEMP/academic-adventure/build/web/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/academic-adventure/build/web
      - uses: actions/deploy-pages@v4
        id: deployment
